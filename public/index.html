<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>Instagram Follower Counter</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg class="ig" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset=".85" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#g)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="url(#g)" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="url(#g)"/></svg>
      <h1 id="name">Instagram</h1>
    </div>
    <p class="label">Followers</p>

    <div class="counter" aria-live="polite">
      <div id="loader" class="loader" role="status" aria-label="Loading"></div>
      <span id="count" class="count hidden">--</span>
    </div>

    <p id="badge" class="badge hidden"></p>
    <div id="error" class="error hidden" role="alert"></div>

    <button id="refresh" type="button">Refresh</button>
    <p class="meta" id="updated">Not updated yet</p>
    <p class="meta small">Auto-refreshes every 60 seconds. The server caches data for a few minutes.</p>
    <p class="note">Data comes from the official Instagram API (Instagram API with Instagram Login) for a Business or Creator account. The count is exact, not rounded.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
